name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tlwar-simulator.tldraw
          generate_release_notes: true
          body: |
            ## How to play

            1. Install [tldraw offline](https://github.com/tldraw/tldraw-offline/releases/latest) (free desktop app)
            2. Download **tlwar-simulator.tldraw** below
            3. Open it in tldraw offline — the simulator loads automatically
